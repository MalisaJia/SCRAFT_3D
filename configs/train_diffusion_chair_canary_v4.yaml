# ============================================================================
# v4 canary 门禁配方：单样本过拟合试验（uid 2ec713b40d8e4f718f03bc301641b78b）
# ----------------------------------------------------------------------------
# 从 configs/train_diffusion_chair_v4.yaml 派生，仅改门禁必需项：
#   batch_size 1（单样本缓存铁律）、gradient_accumulation_steps 1（避免单样本
#   下每次 optimizer step 重复消费同一 batch 拖慢 800 步预算）、
#   eval_interval 200（单样本 eval 便宜但不过密，800 步共 4 次 best 竞争）、
#   condition_dropout 0.0（canary 是条件链路+配方验证，不留 uncond 分支）、
#   num_val_samples/val_batch_size 1（缓存里只有 1 个样本）、
#   latent_cache_dir -> canary 单样本缓存（257 口径，缺失时由 subset 工具
#   从 cache/triposg_latents_chair_v2 按同路径重建）。
# 其余（rank4 / attn2.to_q,to_v 42 挂点 / lr3e-5 / lora_b_weight_decay 1e-2 /
# save_best_checkpoint）与 v4 模板完全一致——canary 的意义就是原样验配方。
# ============================================================================

model:
  backend: "diffusion"
  diffusion:
    model_name: "TripoSG"
    weights_path: "./weights/triposg"
    lora_rank: 4
    lora_target_modules: ["attn2.to_q", "attn2.to_v"]

training:
  # 单样本缓存铁律：batch_size 必须 = 1
  batch_size: 1
  learning_rate: 3.0e-5
  lr_scheduler: "cosine"
  warmup_steps: 100
  max_iterations: 800
  # 单样本下累积无意义，置 1（每 iter 即一次 optimizer step）
  gradient_accumulation_steps: 1
  use_bf16: true
  gradient_checkpointing: true
  ema_decay: 0.9999
  timestep_scale: 1000.0
  # critic 权重表按 uid 查表，canary uid 在 v2 全量权重表内，直接沿用
  critic_weights_path: /root/autodl-tmp/3D-gans/cache/triposg_latents_chair_v2/critic_weights.json
  # canary 门禁：条件全保留，不做 uncond dropout
  condition_dropout: 0.0
  lora_b_weight_decay: 1.0e-2
  save_best_checkpoint: true

data:
  # 单样本 canary 缓存（257 口径）；若不存在用 scripts/subset_latent_cache.py
  # 从 triposg_latents_chair_v2 按白名单 [2ec713b40d8e4f718f03bc301641b78b] 重建到此路径
  latent_cache_dir: "/root/autodl-tmp/3D-gans/cache/triposg_latents_chair_canary_v3"
  annotations_path: "/root/autodl-tmp/objaverse_data/annotations.json"
  num_workers: 4

logging:
  log_interval: 50
  save_interval: 400
  # 门禁要求：单样本 eval 间隔放宽到 200（800 步共 4 次）
  eval_interval: 200
  output_dir: "./outputs/diffusion_train_chair_canary_v4"

rendering:
  image_size: 256
  num_views: 4
  camera_distance: 2.5
  elevation_range: [-30, 30]

evaluation:
  interval: 200
  # 缓存只有 1 个样本，验证采样相应缩到 1
  num_val_samples: 1
  val_batch_size: 1
  clip_model_name: "ViT-B/32"
  clip_pretrained: "openai"
  # v3 链已验证可用的 critic checkpoint
  critic_checkpoint: ./outputs/critic_v2_rerun.pt
